spring:
  application:
    name: GitForge

  config:
    # .env lives in the repo root: found whether the app starts from the root or from gitforge-server/.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
