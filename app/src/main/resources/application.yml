server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gitforge:
  storage:
    root: ./data/repos
    max-push-size: 2GB

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/gitforge
    username: gitforge
    password: ${DB_PASSWORD:}